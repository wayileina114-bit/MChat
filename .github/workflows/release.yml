name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe (PyInstaller)
        run: python -m PyInstaller --noconfirm --clean mchat.spec

      - name: Create portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\MChat\* -DestinationPath dist\MChat-portable.zip

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile "$env:TEMP\is.exe"
          Start-Process -FilePath "$env:TEMP\is.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-' -Wait

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MChat-Setup.exe
            dist/MChat-portable.zip
          generate_release_notes: true
